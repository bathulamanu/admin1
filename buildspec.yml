version: 0.2

phases:
  install:
    runtime-versions: 
      nodejs: 18  # Ensure Node.js version is specified
    commands:
      - npm install  # Install dependencies
  
  pre_build:
    commands:
      - echo "Pre-build phase completed."

  build: 
    commands:
      - npm run build  # Now this should work correctly

  post_build:
    commands:
      - echo "Build completed successfully."

artifacts:
  files:
    - "**/*"
